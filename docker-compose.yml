services:
  web:
    build: .
    image: curemediate
    ports:
      - "${CUREMEDIATE_PORT:-8000}:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    volumes:
      # Analyses, the SQLite database and the generated secret key survive restarts and rebuilds.
      - curemediate-data:/app/var
    restart: unless-stopped

volumes:
  curemediate-data:
